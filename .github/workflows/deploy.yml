name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # cue-parser / design-system / lemona.de 側が更新されたときに叩かれる
  repository_dispatch:
    types: [cue-parser-updated, design-system-updated, lemonade-docs-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_LEMONADE_TOKEN: ${{ secrets.LEMONADE_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5

      - name: Build (next build -> out/)
        run: npm run build

      # melocil.de/cue-parser を配信する。
      # MaxMEllon/cue-parser の web-dist ブランチにビルド済みの静的サイトが置かれている。
      - name: Fetch cue-parser web build
        run: |
          mkdir -p out/cue-parser
          curl -fsSL https://github.com/MaxMEllon/cue-parser/archive/refs/heads/web-dist.tar.gz \
            | tar xz --strip-components=1 -C out/cue-parser

      # melocil.de/design-system を配信する。
      # MaxMEllon/design-system の main の site/（自己完結の 1 ページ）と、各アプリ向けの生成物 dist/。
      # design-system は非公開なので、読み取り専用トークン（secret DESIGN_SYSTEM_READ_TOKEN、
      # design-system の Contents: Read-only）で取得する。
      - name: Fetch design-system docs
        uses: actions/checkout@v4
        with:
          repository: MaxMEllon/design-system
          ref: main
          token: ${{ secrets.DESIGN_SYSTEM_READ_TOKEN }}
          path: design-system
          sparse-checkout: |
            site
            dist

      - name: Place design-system docs
        run: |
          mkdir -p out/design-system
          cp -r design-system/site/. out/design-system/
          cp -r design-system/dist out/design-system/dist

      # melocil.de/lemona.de を配信する。
      # MaxMEllon/lemona.de（非公開）の web-dist ブランチにビルド済みのドキュメント（MkDocs）が置かれている。
      # 読み取り専用トークン（secret LEMONADE_READ_TOKEN、lemona.de の Contents: Read-only）で取得する。
      # トークンが未設定か取得に失敗したときは飛ばし、ほかのページのデプロイは止めない。
      - name: Fetch lemona.de docs
        if: env.HAS_LEMONADE_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: MaxMEllon/lemona.de
          ref: web-dist
          token: ${{ secrets.LEMONADE_READ_TOKEN }}
          path: lemonade-docs

      - name: Place lemona.de docs
        run: |
          if [ ! -f lemonade-docs/index.html ]; then
            echo "no lemona.de docs build; skipping /lemona.de/"
            exit 0
          fi
          mkdir -p out/lemona.de
          rsync -a --exclude .git lemonade-docs/ out/lemona.de/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
