name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # cue-parser 側のビルドが更新されたときに叩かれる
  repository_dispatch:
    types: [cue-parser-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5

      - name: Build (next build -> out/)
        run: npm run build

      # melocil.de/cue-parser を配信する。
      # MaxMEllon/cue-parser の web-dist ブランチにビルド済みの静的サイトが置かれている。
      - name: Fetch cue-parser web build
        run: |
          mkdir -p out/cue-parser
          curl -fsSL https://github.com/MaxMEllon/cue-parser/archive/refs/heads/web-dist.tar.gz \
            | tar xz --strip-components=1 -C out/cue-parser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
